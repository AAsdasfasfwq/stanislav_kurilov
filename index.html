<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alone in the Ocean — film engine</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/three-addons/" } }
</script>
<style>
  :root { --ink:#0b1620; --paper:#ede6d6; --red:#e8432e; --phos:#5cf2c4; --brass:#d9a441; }
  html,body { margin:0; height:100%; background:#05090d; color:var(--paper); font:13px/1.4 "IBM Plex Mono", ui-monospace, monospace; overflow:hidden; }
  body.render { background:#000; }
  #stage { position:absolute; inset:0 0 86px 0; display:flex; align-items:center; justify-content:center; }
  body.render #stage { inset:0; display:block; }
  #out, #guides { width:min(100vw, calc((100vh - 86px) * 16 / 9)); aspect-ratio:16/9; display:block; }
  body.render #out { width:1920px; height:1080px; }
  #guides { position:absolute; pointer-events:none; }
  #ui { position:absolute; left:0; right:0; bottom:0; height:86px; background:#0b1117; border-top:1px solid #1d2a33; display:flex; flex-direction:column; }
  body.render #ui { display:none; }
  #track { position:relative; height:30px; margin:8px 14px 4px; cursor:pointer; }
  #track .seg { position:absolute; top:6px; height:18px; border-radius:2px; background:#1a2a35; border:1px solid #27404f; box-sizing:border-box; font-size:10px; padding:2px 4px; overflow:hidden; white-space:nowrap; color:#8fb0c0; }
  #track .seg.missing { background:repeating-linear-gradient(45deg,#1a2a35,#1a2a35 4px,#22313b 4px,#22313b 8px); }
  #head { position:absolute; top:0; bottom:0; width:2px; background:var(--red); }
  #row { display:flex; gap:14px; align-items:center; padding:0 14px; }
  button { background:#15212a; color:var(--paper); border:1px solid #2a3c48; padding:4px 10px; font:inherit; cursor:pointer; border-radius:3px; }
  button:hover { border-color:var(--phos); }
  #tc { font-size:16px; color:var(--brass); min-width:110px; }
  #line { flex:1; color:#9fb6c2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:"Instrument Serif", Georgia, serif; font-style:italic; font-size:16px; }
  #status { color:#6f8a98; }
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1920" height="1080"></canvas><canvas id="guides" width="1920" height="1080"></canvas></div>
<div id="ui">
  <div id="track"><div id="head"></div></div>
  <div id="row">
    <button id="play">▶ play</button>
    <span id="tc">0:00.00</span>
    <span id="line"></span>
    <span id="status">loading…</span>
  </div>
</div>
<script type="module" src="./engine/player.js"></script>
</body>
</html>
