<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/three-addons/" } }</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// Sketch harness: renders any module exporting draw(ctx, t, E) through the real engine (+post).
// tools/sketch.html?mod=/tools/tests/chars.js   → window.__draw(t)
import { E } from '../engine/core.js';
const mod = await import(new URLSearchParams(location.search).get('mod'));
await E.boot({ mode: 'render', outCanvas: document.getElementById('c') });
if (mod.preload) await mod.preload(E);
const fakeSeg = { id: 'sketch', start: 0, end: 1e9, title: 'sketch' };
E.modules.set('sketch', { render: (ctx, t) => mod.draw(ctx, t, E) });
window.__draw = (t) => { E.current = fakeSeg; E.t = t; E.frame = Math.round(t * 30); E.postFx.reset(); E.layers.reset();
  const ctx = E.ctx; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#0b1620'; ctx.fillRect(0,0,1920,1080); ctx.save(); mod.draw(ctx, t, E); ctx.restore();
  if (mod.raw) { const o = document.getElementById('c'); } E.postFx.render(E.comp, E.frame, t); return true; };
window.__READY = true;
</script></body></html>
